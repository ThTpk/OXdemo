<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกม OX (Tic-Tac-Toe)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --cell-bg: #334155;
            --cell-hover: #475569;
            --x-color: #38bdf8;
            --o-color: #fb7185;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --win-bg: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            background-color: var(--cell-bg);
            color: var(--text-muted);
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--x-color);
            border-color: var(--x-color);
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            background-color: var(--bg-color);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .score-x { color: var(--x-color); }
        .score-o { color: var(--o-color); }

        .status {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 1.5em;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .cell {
            background-color: var(--cell-bg);
            aspect-ratio: 1;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s, background-color 0.2s;
        }

        .cell:hover:not(.taken) {
            background-color: var(--cell-hover);
            transform: scale(1.03);
        }

        .cell.x {
            color: var(--x-color);
        }

        .cell.o {
            color: var(--o-color);
        }

        .cell.win {
            background-color: var(--win-bg);
            color: #ffffff;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: var(--cell-bg);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--cell-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>เกม OX</h1>

    <div class="mode-selector">
        <button class="mode-btn active" id="mode-pvp" onclick="setMode('pvp')">เล่น 2 คน</button>
        <button class="mode-btn" id="mode-ai" onclick="setMode('ai')">แข่งกับบอท</button>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <span class="score-label">ผู้เล่น X</span>
            <span class="score-value score-x" id="score-x">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">เสมอ</span>
            <span class="score-value" id="score-draw">0</span>
        </div>
        <div class="score-box">
            <span class="score-label" id="label-o">ผู้เล่น O</span>
            <span class="score-value score-o" id="score-o">0</span>
        </div>
    </div>

    <div class="status" id="status">ตาของผู้เล่น X</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="resetBoard()">เริ่มรอบใหม่</button>
        <button class="btn btn-secondary" onclick="resetScores()">ล้างคะแนน</button>
    </div>
</div>

<script>
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status');
    const scoreXEl = document.getElementById('score-x');
    const scoreOEl = document.getElementById('score-o');
    const scoreDrawEl = document.getElementById('score-draw');
    const labelOEl = document.getElementById('label-o');

    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    let gameMode = 'pvp'; // 'pvp' หรือ 'ai'
    let scores = { X: 0, O: 0, draw: 0 };

    const winConditions = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // แนวนอน
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // แนวตั้ง
        [0, 4, 8], [2, 4, 6]             // แนวทแยง
    ];

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));

    function setMode(mode) {
        gameMode = mode;
        document.getElementById('mode-pvp').classList.toggle('active', mode === 'pvp');
        document.getElementById('mode-ai').classList.toggle('active', mode === 'ai');
        labelOEl.textContent = mode === 'ai' ? 'บอท O' : 'ผู้เล่น O';
        resetScores();
    }

    function handleCellClick(e) {
        const index = e.target.getAttribute('data-index');
        if (board[index] !== '' || !gameActive) return;
        if (gameMode === 'ai' && currentPlayer === 'O') return;

        makeMove(index, currentPlayer);

        if (gameActive && gameMode === 'ai' && currentPlayer === 'O') {
            setTimeout(makeAIMove, 350);
        }
    }

    function makeMove(index, player) {
        board[index] = player;
        const cell = cells[index];
        cell.textContent = player;
        cell.classList.add(player.toLowerCase(), 'taken');

        checkResult();
    }

    function checkResult() {
        let roundWon = false;
        let winningCombo = [];

        for (let condition of winConditions) {
            const [a, b, c] = condition;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                roundWon = true;
                winningCombo = condition;
                break;
            }
        }

        if (roundWon) {
            const winnerName = (gameMode === 'ai' && currentPlayer === 'O') ? 'บอท O' : `ผู้เล่น ${currentPlayer}`;
            statusText.textContent = `🎉 ${winnerName} ชนะ!`;
            gameActive = false;
            scores[currentPlayer]++;
            updateScoreboard();
            winningCombo.forEach(idx => cells[idx].classList.add('win'));
            return;
        }

        if (!board.includes('')) {
            statusText.textContent = '🤝 เสมอกัน!';
            gameActive = false;
            scores.draw++;
            updateScoreboard();
            return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        const nextName = (gameMode === 'ai' && currentPlayer === 'O') ? 'บอท O กำลังคิด...' : `ตาของผู้เล่น ${currentPlayer}`;
        statusText.textContent = nextName;
    }

    function makeAIMove() {
        if (!gameActive) return;

        // 1. หาช่องที่บอทชนะทันที
        let move = findBestMove('O');
        // 2. ถ้าไม่มี ให้บล็อกช่องที่ผู้เล่น X กำลังจะชนะ
        if (move === null) move = findBestMove('X');
        // 3. ยึดช่องตรงกลางถ้าว่าง
        if (move === null && board[4] === '') move = 4;
        // 4. สุ่มช่องว่างที่เหลือ
        if (move === null) {
            const available = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            move = available[Math.floor(Math.random() * available.length)];
        }

        if (move !== null && move !== undefined) {
            makeMove(move, 'O');
        }
    }

    function findBestMove(player) {
        for (let condition of winConditions) {
            const [a, b, c] = condition;
            const values = [board[a], board[b], board[c]];
            if (values.filter(v => v === player).length === 2 && values.includes('')) {
                if (board[a] === '') return a;
                if (board[b] === '') return b;
                if (board[c] === '') return c;
            }
        }
        return null;
    }

    function updateScoreboard() {
        scoreXEl.textContent = scores.X;
        scoreOEl.textContent = scores.O;
        scoreDrawEl.textContent = scores.draw;
    }

    function resetBoard() {
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        gameActive = true;
        statusText.textContent = 'ตาของผู้เล่น X';
        cells.forEach(cell => {
            cell.textContent = '';
            cell.className = 'cell';
        });
    }

    function resetScores() {
        scores = { X: 0, O: 0, draw: 0 };
        updateScoreboard();
        resetBoard();
    }
</script>

</body>
</html>
